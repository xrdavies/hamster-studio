name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?Missing MAC_CERTIFICATE_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing MAC_CERTIFICATE_PASSWORD}"
          certificate_path="$RUNNER_TEMP/studio-signing.p12"
          keychain_path="$RUNNER_TEMP/studio-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path" > /dev/null
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain_path"
          echo "CSC_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - name: Build signed macOS app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build
      - name: Publish update metadata
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac dmg --publish always
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: hamster-studio-macos
          path: release/*.dmg
      - name: Remove temporary signing credentials
        if: always()
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/studio-signing.keychain-db"
          if [ -f "$keychain_path" ]; then
            security delete-keychain "$keychain_path"
          fi
          python3 -c 'import os; from pathlib import Path; Path(os.environ["RUNNER_TEMP"], "studio-signing.p12").unlink(missing_ok=True)'
